<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Illustration of a CRM dashboard">
  <rect width="800" height="500" fill="#1e2a3d"/>

  <!-- Sidebar -->
  <rect width="170" height="500" fill="#16202f"/>
  <text x="24" y="44" fill="#e6f1ff" font-family="sans-serif" font-size="20" font-weight="700">Django CRM</text>
  <g font-family="sans-serif" font-size="15" fill="#a8b2d1">
    <rect x="12" y="76" width="146" height="34" rx="6" fill="#2b3a52"/>
    <text x="28" y="98" fill="#e6f1ff">Dashboard</text>
    <text x="28" y="140">Customers</text>
    <text x="28" y="176">Records</text>
    <text x="28" y="212">Users &amp; Roles</text>
    <text x="28" y="248">Settings</text>
  </g>

  <!-- Top bar -->
  <rect x="170" width="630" height="64" fill="#1a2536"/>
  <rect x="196" y="18" width="260" height="28" rx="6" fill="#2b3a52"/>
  <text x="210" y="37" fill="#8892b0" font-family="sans-serif" font-size="13">Search customers…</text>
  <circle cx="760" cy="32" r="16" fill="#3b4a63"/>

  <!-- KPI cards -->
  <g font-family="sans-serif">
    <rect x="196" y="88" width="180" height="90" rx="10" fill="#26344a"/>
    <text x="214" y="118" fill="#8892b0" font-size="13">Customers</text>
    <text x="214" y="156" fill="#e6f1ff" font-size="30" font-weight="700">128</text>

    <rect x="392" y="88" width="180" height="90" rx="10" fill="#26344a"/>
    <text x="410" y="118" fill="#8892b0" font-size="13">New this month</text>
    <text x="410" y="156" fill="#e6f1ff" font-size="30" font-weight="700">14</text>

    <rect x="588" y="88" width="186" height="90" rx="10" fill="#26344a"/>
    <text x="606" y="118" fill="#8892b0" font-size="13">Active sessions</text>
    <text x="606" y="156" fill="#e6f1ff" font-size="30" font-weight="700">6</text>
  </g>

  <!-- Customer table -->
  <rect x="196" y="198" width="578" height="280" rx="10" fill="#26344a"/>
  <g font-family="sans-serif" font-size="13" fill="#8892b0">
    <text x="216" y="228">NAME</text>
    <text x="400" y="228">EMAIL</text>
    <text x="590" y="228">CITY</text>
    <text x="690" y="228">ACTIONS</text>
  </g>
  <line x1="196" y1="242" x2="774" y2="242" stroke="#3b4a63"/>
  <g fill="#4a5a75">
    <rect x="216" y="262" width="120" height="10" rx="5"/><rect x="400" y="262" width="150" height="10" rx="5"/><rect x="590" y="262" width="70" height="10" rx="5"/>
    <rect x="216" y="306" width="100" height="10" rx="5"/><rect x="400" y="306" width="170" height="10" rx="5"/><rect x="590" y="306" width="60" height="10" rx="5"/>
    <rect x="216" y="350" width="130" height="10" rx="5"/><rect x="400" y="350" width="140" height="10" rx="5"/><rect x="590" y="350" width="80" height="10" rx="5"/>
    <rect x="216" y="394" width="90" height="10" rx="5"/><rect x="400" y="394" width="160" height="10" rx="5"/><rect x="590" y="394" width="65" height="10" rx="5"/>
    <rect x="216" y="438" width="115" height="10" rx="5"/><rect x="400" y="438" width="135" height="10" rx="5"/><rect x="590" y="438" width="75" height="10" rx="5"/>
  </g>
  <g fill="#64ffda">
    <rect x="690" y="258" width="22" height="18" rx="4"/><rect x="718" y="258" width="22" height="18" rx="4" fill="#ff6b6b"/>
    <rect x="690" y="302" width="22" height="18" rx="4"/><rect x="718" y="302" width="22" height="18" rx="4" fill="#ff6b6b"/>
    <rect x="690" y="346" width="22" height="18" rx="4"/><rect x="718" y="346" width="22" height="18" rx="4" fill="#ff6b6b"/>
    <rect x="690" y="390" width="22" height="18" rx="4"/><rect x="718" y="390" width="22" height="18" rx="4" fill="#ff6b6b"/>
    <rect x="690" y="434" width="22" height="18" rx="4"/><rect x="718" y="434" width="22" height="18" rx="4" fill="#ff6b6b"/>
  </g>
</svg>
